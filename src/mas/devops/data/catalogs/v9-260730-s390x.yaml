editorial:
  whats_new:
  - title: New feature release
    details:
    - IBM Maximo Application Suite Core Platform [v9.2.0](https://www.ibm.com/support/pages/node/7277376)
    - IBM Maximo Manage [v9.2.0](https://www.ibm.com/support/pages/node/7276377)
